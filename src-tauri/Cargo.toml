[package]
name = "ciyuan-proxy"
version = "0.1.5"
description = "词元代理 - 模型API Token本地管理工具"
authors = ["ciyuan-proxy team"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "ciyuan_proxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.7.4", features = [] }

[dependencies]
tauri = { version = "~2.12.5", features = [] }
tauri-plugin-clipboard = "~2.1.11"
tauri-plugin-updater = "~2.14.1"
tauri-plugin-opener = "~2.7.2"
tauri-plugin-single-instance = "~2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
dirs = "6"
once_cell = "1.19"
thiserror = "2"
clipboard = "0.5"
reqwest = { version = "0.12", features = ["native-tls", "blocking", "gzip", "stream", "json"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
flate2 = "1.0"
encoding_rs = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
